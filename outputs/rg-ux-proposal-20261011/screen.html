<head>

  <style>
    @font-face{font-family:Inter;src:url(fonts/inter-400.woff2) format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:Inter;src:url(fonts/inter-600.woff2) format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:Inter;src:url(fonts/inter-700.woff2) format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'Archivo Black';src:url(fonts/archivo-400.woff2) format('woff2');font-weight:400;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:var(--paper-soft);color:var(--ink);font:400 16px/1.45 var(--font-sans);-webkit-tap-highlight-color:transparent}button,a,summary{touch-action:manipulation}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:disabled{cursor:default}svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.demo{background:var(--info-bg);color:var(--info);font-size:11px;font-weight:600;text-align:center;padding:5px 8px}.app-header{height:58px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;line-height:1.1}.brand-mark{display:flex;gap:3px;align-items:center}.brand-mark i{width:7px;height:7px;border-radius:50%;background:var(--green)}.brand-mark i:nth-child(2){background:var(--blue)}.brand-mark i:nth-child(3){background:var(--yellow)}.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted-on-dark);margin-top:3px}.environment{font-size:11px;font-weight:600;padding:6px 10px;border:1px solid var(--glass-border-dark);border-radius:var(--radius-pill);color:var(--muted-on-dark)}main{padding:20px 18px 112px;max-width:520px;margin:auto}.intro{margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted-on-light);font-weight:700;text-transform:uppercase;margin:0 0 8px}h1{font:400 27px/1.15 var(--font-display);letter-spacing:-.025em;margin:0 0 8px}h2{font:400 20px/1.2 var(--font-display);letter-spacing:-.02em;margin:0}p{margin:0}.intro>p:last-child{font-size:15px;color:var(--muted-on-light)}.task{background:var(--paper);border:1px solid var(--line-light);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px}.task-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.side-label{font-size:12px;font-weight:600;color:var(--muted-on-light)}.side-label strong{display:block;font-size:16px;color:var(--ink);margin-top:2px}.step-marker{display:flex;gap:5px}.step-marker span{width:28px;height:5px;border-radius:var(--radius-pill);background:var(--line-light)}.step-marker .current{background:var(--green)}.step-marker .complete{background:var(--success)}.guide{height:96px;background:var(--paper-soft);border-radius:var(--input-radius);display:flex;align-items:center;justify-content:center}.guide svg{height:84px;width:154px;color:var(--muted-on-light);stroke-width:1.6}.instruction{font-size:15px;color:var(--muted-on-light);line-height:1.45}.actions{display:flex;flex-direction:column;gap:10px}.button{min-height:48px;border-radius:var(--radius-pill);padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;text-decoration:none}.button svg{width:20px;height:20px}.primary{background:var(--yellow);color:var(--ink);border:1px solid var(--yellow)}.secondary{background:transparent;border:1px solid var(--line-light);color:var(--ink)}.quiet{background:transparent;border:0;color:var(--muted-on-light);text-decoration:underline;text-underline-offset:4px}.saved-side{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--success)}.saved-side svg{width:17px;height:17px}.muted{color:var(--muted-on-light)}.extra{margin-top:12px;font-size:14px;color:var(--muted-on-light)}.extra summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}.extra summary::-webkit-details-marker{display:none}.extra summary svg{width:18px;height:18px}.extra ul{padding-left:20px;margin:6px 0 12px;display:flex;flex-direction:column;gap:10px}.help{min-height:48px;display:flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;font-weight:600;color:var(--blue)}.help svg{width:18px;height:18px}.privacy{margin-top:8px;font-size:12px;color:var(--muted-on-light)}.status-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}.status-icon.success{background:var(--success-bg);color:var(--success)}.status-icon.warning{background:var(--warning-bg);color:var(--warning)}.status-icon.danger{background:var(--danger-bg);color:var(--danger)}.state-card{gap:16px}.state-card .instruction{font-size:16px}.status-line{border-radius:var(--input-radius);padding:12px 14px;background:var(--info-bg);color:var(--info);font-size:14px;display:flex;align-items:flex-start;gap:8px}.status-line.success{background:var(--success-bg);color:var(--success)}.status-line.warning{background:var(--warning-bg);color:var(--warning)}.status-line.danger{background:var(--danger-bg);color:var(--danger)}.status-line svg{height:18px;width:18px;margin-top:1px}.review-image{height:176px;display:flex;align-items:center;justify-content:center;background:var(--paper-soft);border:1px solid var(--line-light);border-radius:var(--input-radius)}.review-image svg{width:240px;height:154px;stroke-width:1.5;color:var(--muted-on-light)}.local-note{font-size:12px;font-weight:600;color:var(--muted-on-light);margin-top:-6px}.receipt{padding-top:14px;border-top:1px solid var(--line-light);display:flex;flex-direction:column;gap:10px}.receipt .saved-side{font-size:14px}.filename{display:flex;gap:12px;align-items:center;background:var(--paper-soft);padding:16px;border:1px solid var(--line-light);border-radius:var(--input-radius)}.filename small{display:block;color:var(--muted-on-light);font-size:12px;margin-top:4px}.dock{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:stretch;justify-content:center;background:var(--paper);border-top:1px solid var(--line-light);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:2}.dock button{border:0;background:none;min-width:48px;min-height:58px;flex:1;max-width:100px;color:var(--muted-on-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;padding:6px 0}.dock svg{width:22px;height:22px}.dock button[aria-current=page]{color:var(--green)}.dock .exit{color:var(--muted-on-light)}dialog{border:1px solid var(--line-light);background:var(--paper);color:var(--ink);border-radius:var(--radius);width:min(100% - 32px,400px);padding:24px;box-shadow:var(--shadow-zero-g)}dialog::backdrop{background:var(--glass-bg-dark)}dialog h2{margin-bottom:12px}dialog p{font-size:15px;color:var(--muted-on-light);margin-bottom:18px}body.dark{background:var(--ink);color:var(--paper)}body.dark .task,body.dark .dock,body.dark dialog{background:var(--ink-soft);border-color:var(--glass-border-dark);color:var(--paper)}body.dark .eyebrow,body.dark .intro>p:last-child,body.dark .instruction,body.dark .muted,body.dark .side-label,body.dark .extra,body.dark .privacy,body.dark .local-note,body.dark .filename small,body.dark dialog p{color:var(--muted-on-dark)}body.dark .side-label strong{color:var(--paper)}body.dark .guide,body.dark .review-image,body.dark .filename{background:var(--ink);border-color:var(--glass-border-dark)}body.dark .guide svg,body.dark .review-image svg{color:var(--muted-on-dark)}body.dark .secondary{color:var(--paper);border-color:var(--glass-border-dark)}body.dark .quiet{color:var(--muted-on-dark)}body.dark .dock button{color:var(--muted-on-dark)}body.dark .dock button[aria-current=page],body.dark .help{color:var(--yellow-soft)}body.dark .saved-side{color:var(--paper)}body.dark .receipt{border-color:var(--glass-border-dark)}body.dark button:focus-visible,body.dark a:focus-visible,body.dark summary:focus-visible{outline-color:var(--yellow)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}@media(max-width:375px){main{padding-top:16px}.task{padding:16px;gap:12px}.intro{margin-bottom:16px}.guide{height:84px}h1{font-size:25px}.intro>p:last-child,.instruction{font-size:15px}}
  </style>
  <style>
    .document-status{display:flex;align-items:center;gap:12px;width:100%;min-height:92px;padding:18px;text-align:left;border-radius:var(--radius);border:1px solid var(--danger);background:var(--danger-bg);color:var(--danger)}.document-status strong{display:block;font-size:16px;line-height:1.35}.document-status small{display:block;font-size:13px;margin-top:4px}.document-status>svg:last-child{margin-left:auto;width:18px;height:18px;transform:rotate(-90deg)}.document-status.pending{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}.document-status.approved{background:var(--glass-bg-light);border-color:var(--line-light);color:var(--ink);backdrop-filter:var(--glass-blur)}.status-summary{display:flex;gap:10px;margin:14px 0;color:var(--muted-on-light);font-size:13px}.status-summary span{flex:1;border:1px solid var(--line-light);border-radius:var(--input-radius);padding:12px}.status-summary strong{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}.photo-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.photo-tile{border:1px solid var(--line-light);border-radius:var(--input-radius);padding:12px;font-size:13px;color:var(--muted-on-light)}.photo-tile strong{display:block;color:var(--ink);margin-top:8px}.photo-tile .guide{height:72px}.photo-tile .guide svg{height:62px;width:106px}.small-status{font-size:13px;color:var(--muted-on-light);margin:12px 0 18px}.compact-result{margin-top:14px}.compact-result h2{font-size:18px}.sheet{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,520px);max-height:90dvh;padding:24px 22px calc(24px + env(safe-area-inset-bottom));border-radius:var(--radius-lg) var(--radius-lg) 0 0}.sheet .actions{margin-top:20px}.sheet .close{display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;position:absolute;right:12px;top:10px;color:var(--muted-on-light);background:none;border:0;font-size:24px}.sheet h2{padding-right:44px;margin-bottom:10px}.sheet .instruction{padding-right:12px}.sheet small{color:var(--muted-on-light);font-size:12px;display:block;margin-top:14px}.sheet::backdrop{background:var(--glass-bg-dark)}.dark .document-status.approved{background:var(--glass-bg-dark);color:var(--paper);border-color:var(--glass-border-dark)}.dark .status-summary,.dark .small-status,.dark .photo-tile{color:var(--muted-on-dark)}.dark .status-summary span,.dark .photo-tile{border-color:var(--glass-border-dark)}.dark .status-summary strong,.dark .photo-tile strong{color:var(--paper)}
  </style>
</head>
<body>
  <div class="demo">Proposta de interface · interações de demonstração</div>
  <header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Supletivo<small>Brasil</small></span></div><span class="environment">Aluno · Matrícula</span></header>
  <main id="main"></main>
  <nav class="dock" aria-label="Documentos da matrícula"></nav>
  <dialog id="demo-dialog"><h2>Demonstração da proposta</h2><p id="dialog-message"></p><button class="button primary" id="close-dialog">Entendi</button></dialog>
  <dialog id="capture-sheet" class="sheet" aria-labelledby="capture-title"><button type="button" class="close" aria-label="Fechar opções de envio" data-action="close_sheet">×</button><h2 id="capture-title">Adicionar seu RG</h2><p id="capture-instruction" class="instruction"></p><div class="actions"><button type="button" class="button primary" data-action="take_photo">Tirar foto</button><button type="button" class="button secondary" data-action="pick_file">Anexar documento</button></div><small>Mostre as quatro bordas e evite reflexos.</small></dialog>
  <script>
    const icons={camera:'<path d="M14.5 4h-5L7 7H3v13h18V7h-4z"/><circle cx="12" cy="13" r="4"/>',file:'<path d="M14 2H6v20h12V6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 3 2 21h20zM12 9v5M12 18h.01"/>',id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="7" cy="11" r="2"/><path d="M4 16c0-3 6-3 6 0M13 10h5M13 14h5"/>',home:'<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/>',school:'<path d="m2 9 10-6 10 6-10 6zM5 11v6c4 4 10 4 14 0v-6M22 9v8"/>',face:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10h.01M15 10h.01M9 15c2 2 4 2 6 0"/>',exit:'<path d="M10 4H4v16h6M10 12h11m-4-4 4 4-4 4"/>',chevron:'<path d="m6 9 6 6 6-6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/>'};
    const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
    const picture=side=>`<svg viewBox="0 0 240 140" aria-hidden="true"><rect x="8" y="8" width="224" height="124" rx="10"/>${side==='back'?'<path d="M28 38h125M28 56h168M28 74h149M28 104h70M136 104h58"/>':'<rect x="26" y="29" width="58" height="80" rx="5"/><circle cx="55" cy="53" r="12"/><path d="M37 91c0-25 36-25 36 0M102 38h106M102 58h87M102 78h98M102 105h48"/>'}</svg>`;
    const button=(label,action,kind='primary',glyph='')=>`<button type="button" class="button ${kind}" data-action="${action}">${glyph?icon(glyph):''}${label}</button>`;
    const saved=label=>`<div class="saved-side">${icon('check')}<span>${label}</span></div>`;
    const extras=`<details class="extra"><summary>Dicas para uma boa foto ${icon('chevron')}</summary><ul><li>Deixe o RG inteiro dentro da foto.</li><li>Use boa luz e evite reflexos.</li><li>Confira se os dados estão legíveis.</li></ul></details><button class="help quiet" data-action="help">${icon('help')}Preciso de ajuda</button>`;
    let state=new URLSearchParams(location.search).get('state')||'empty';
    let theme=new URLSearchParams(location.search).get('theme')||'light';
    let pendingSide='front';
    const stateMeta={empty:'RG pendente',front_local:'Frente adicionada',back_local:'Verso adicionado',received:'RG recebido',pdf_received:'Arquivo completo',checking:'Conferindo arquivo',invalid:'Arquivo não é documento',unknown_side:'Lado não identificado',uploading:'Envio em curso',partial_upload:'Envio parcial',consult_error:'Consulta indisponível',receipt_uncertain:'Recebimento incerto',rejected_back:'Verso rejeitado',manual_review:'Conferência da coordenação',approved:'Aprovado, endereço liberado',approved_wait:'Aprovado, dados pendentes'};
    function capture(side){const back=side==='back';return `<section class="task"><div class="task-heading"><p class="side-label">${back?'2':'1'} de 2<strong>${back?'Verso':'Frente'} do RG</strong></p><span class="step-marker" aria-label="${back?'Frente conferida, verso solicitado':'Frente solicitada, verso depois'}"><span class="${back?'complete':'current'}"></span><span class="${back?'current':''}"></span></span></div>${back?saved('Frente conferida'):''}<div class="guide">${picture(side)}</div><p class="instruction">${back?'Mostre o lado com os dados do RG.':'Mostre o lado com sua foto.'}<br>Inclua as quatro bordas, sem reflexos.</p><div class="actions">${button(`Fotografar ${back?'verso':'frente'}`,`preview_${side}`,'primary','camera')}${button('Escolher arquivo',`preview_${side}`,'secondary','file')}</div></section>${extras}`}
    function preview(side){const back=side==='back';return `<section class="task"><div class="task-heading"><h2>Confira a foto</h2><span class="side-label">${back?'Verso':'Frente'}</span></div><div class="review-image">${picture(side)}</div><p class="local-note">Prévia · ainda não enviada</p><p class="instruction">O RG aparece inteiro e os dados estão legíveis?</p><div class="actions">${button('Usar esta foto',`send_${side}`)}${button('Tirar outra foto',side,'secondary','camera')}</div></section>`}
    function statusCard(title,text,options={}){return `<section class="task state-card"><div class="status-icon ${options.tone||''}">${icon(options.glyph||'clock')}</div><h2>${title}</h2><p class="instruction">${text}</p>${options.receipts?`<div class="receipt">${options.receipts}</div>`:''}${options.note?`<div class="status-line ${options.tone||''}">${icon(options.glyph||'clock')}<span>${options.note}</span></div>`:''}<div class="actions">${options.actions||''}</div></section>${extras}`}
    const statusButton=(title,subtitle,tone='',action='open_sheet')=>`<button type="button" class="document-status ${tone}" data-action="${action}">${icon(tone==='approved'?'check':tone==='pending'?'clock':'id')}<span><strong>${title}</strong><small>${subtitle}</small></span>${icon('chevron')}</button>`;
    const localPhoto=side=>`<div class="photo-list"><div class="photo-tile"><div class="guide">${picture(side)}</div><strong>${side==='front'?'Frente':'Verso'} adicionada</strong><span>No dispositivo</span></div><div class="photo-tile"><strong>${side==='front'?'Verso':'Frente'} do RG</strong><span>Falta adicionar</span></div></div><p class="small-status">Ainda não enviado. Junte os dois lados para iniciar o envio.</p>`;
    const receivedPhotos=()=>`<div class="status-summary"><span><strong>Frente</strong>Recebida</span><span><strong>Verso</strong>Recebido</span></div>`;
    function bodyForState(){switch(state){case'empty':return statusButton('Enviar seu RG','Faltam frente e verso')+`<div class="status-summary"><span><strong>Frente</strong>Falta adicionar</span><span><strong>Verso</strong>Falta adicionar</span></div><p class="small-status">Pode começar por qualquer lado. Um arquivo com o RG completo também é aceito.</p>`+extras;case'front_local':return statusButton('Adicione o verso','A frente já está selecionada')+localPhoto('front')+extras;case'back_local':return statusButton('Adicione a frente','O verso já está selecionado')+localPhoto('back')+extras;case'checking':return statusCard('Conferindo o arquivo','Verificando se é um documento legível e qual lado foi fotografado.',{note:'Isso ainda não é aprovação do RG.',actions:button('Ver classificação','front_local','secondary')});case'invalid':return statusButton('Escolha outra foto','O arquivo não parece um RG')+`<div class="status-line danger compact-result">${icon('alert')}<span>Fotografe o documento inteiro, com os dados legíveis.</span></div>`+extras;case'unknown_side':return statusCard('Qual lado aparece na foto?','Não foi possível identificar o lado com segurança.',{tone:'warning',glyph:'alert',actions:button('É a frente','front_local')+button('É o verso','back_local','secondary')});case'uploading':return statusCard('Enviando seu RG','Frente e verso já foram selecionados. Aguarde a confirmação do recebimento.',{note:'O documento ainda não foi aprovado.',actions:button('Ver confirmação','received','secondary')});case'received':return statusButton('RG recebido · Em análise','Frente e verso enviados','pending','consult')+receivedPhotos()+`<p class="small-status">Estamos conferindo os dados. As fotos foram recebidas; você pode sair e voltar.</p>`+button('Consultar resultado','consult','secondary')+extras;case'pdf_received':return statusButton('RG recebido · Em análise','Arquivo completo enviado','pending','consult')+`<div class="filename compact-result">${icon('file')}<div><strong>documento-exemplo.pdf</strong><small>Arquivo completo · recebido</small></div></div><p class="small-status">Aguardando conferência dos dados.</p>`+button('Consultar resultado','consult','secondary')+extras;case'partial_upload':return statusCard('O verso ainda não foi enviado','A frente foi recebida. Não conseguimos terminar o envio do verso.',{tone:'warning',glyph:'alert',receipts:saved('Frente recebida · mantida'),actions:button('Tentar enviar só o verso','received')});case'consult_error':return statusButton('RG recebido','Resultado indisponível agora','pending','consult')+receivedPhotos()+`<div class="status-line compact-result">${icon('clock')}<span>Não é necessário reenviar. Tente consultar novamente.</span></div>`+button('Consultar novamente','received','secondary')+extras;case'receipt_uncertain':return statusCard('Vamos conferir o envio','A conexão foi interrompida antes da confirmação. Consulte o que foi recebido antes de repetir o envio.',{tone:'warning',glyph:'alert',actions:button('Conferir recebimento','received')});case'rejected_back':return statusButton('Substitua a foto do verso','A frente foi mantida')+`<div class="status-line danger compact-result">${icon('alert')}<span>Parte do verso ficou cortada. Inclua as quatro bordas na nova foto.</span></div>`+saved('Frente recebida · mantida')+extras;case'manual_review':return statusButton('RG em conferência','Aguardando parecer da coordenação','pending','consult')+receivedPhotos()+`<p class="small-status">A coordenação está revisando o documento. Orientações específicas aparecem aqui quando houver.</p>`+button('Consultar resultado','manual_review','secondary')+extras;case'approved_wait':return statusButton('RG aprovado','Concluindo o preenchimento dos dados','approved','view_document')+`<p class="small-status">A próxima etapa aparecerá quando estiver disponível na matrícula.</p>`+button('Consultar matrícula','approved','secondary')+extras;case'approved':return statusButton('RG aprovado','Ver documento e dados extraídos','approved','view_document')+`<p class="small-status">Próximo: comprovante de endereço.</p>`+button('Continuar','continue')+extras;default:state='empty';return bodyForState()}}
    function render(){document.body.classList.toggle('dark',theme==='dark');document.querySelector('main').innerHTML=`<div class="intro"><p class="eyebrow">Documentos · Etapa 1 de 4</p><h1>Seu RG</h1><p>Envie frente e verso para conferirmos seus dados.</p></div><div id="state-content" aria-live="polite" aria-atomic="false">${bodyForState()}</div>`;document.querySelector('.dock').innerHTML=[['id','RG'],['home','Endereço'],['school','Escolaridade'],['face','Selfie'],['exit','Sair']].map(([i,label],n)=>`<button type="button" ${n===0?'aria-current="page"':''} data-action="${n===0?'current':'navigation'}">${icon(i)}${label}</button>`).join('');document.title=`${stateMeta[state]||'RG'} — Proposta Supletivo`;window.parent.postMessage({type:'rg-prototype-state',state,theme},location.origin)}
    function setState(next){state=next;const query=new URLSearchParams({state,theme});history.replaceState(null,'',`?${query}`);render();window.scrollTo({top:0});}
    function notice(message){document.getElementById('dialog-message').textContent=message;document.getElementById('demo-dialog').showModal()}
    document.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='help')return notice('Na implementação, a ajuda deve vir da configuração do backend. Este protótipo não abre uma conversa.');if(action==='continue')return notice('A próxima tela é o comprovante de endereço. O avanço real depende do status da matrícula no backend.');if(action==='navigation')return notice('O dock adaptativo permanece. A navegação real e as permissões são definidas pelo backend.');if(action==='current')return;if(action==='view_document')return notice('Aqui ficam o documento salvo e os dados extraídos pelo backend. A demonstração não usa dados pessoais.');if(action==='open_sheet'){document.getElementById('capture-instruction').textContent=state==='front_local'?'Adicione o verso. A frente está selecionada e ainda não foi enviada.':state==='back_local'?'Adicione a frente. O verso está selecionado e ainda não foi enviado.':state==='rejected_back'?'Substitua apenas o verso. A frente recebida será mantida.':'Fotografe ou anexe seu documento. Pode começar pela frente ou pelo verso.';document.getElementById('capture-sheet').showModal();return;}if(action==='close_sheet')return document.getElementById('capture-sheet').close();if(action==='take_photo'){document.getElementById('capture-sheet').close();setState(['front_local','back_local','rejected_back'].includes(state)?'received':'front_local');return;}if(action==='pick_file'){document.getElementById('capture-sheet').close();setState('pdf_received');return;}if(action==='consult')return notice('O resultado depende do backend. Use os controles da proposta para comparar espera, revisão, rejeição e aprovação; consultar não simula uma aprovação automática.');setState(action)});
    document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('demo-dialog').close());
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='rg-prototype-control')return;theme=event.data.theme||theme;setState(event.data.state||state)});
    render();
  </script>
</body>
</html>
